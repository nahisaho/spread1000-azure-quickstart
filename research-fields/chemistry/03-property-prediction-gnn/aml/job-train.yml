$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: molecule-gnn-train
description: Train a 3-layer GINE on MoleculeNet ESOL for aqueous solubility regression.

code: ../src
command: >-
  python train.py
  --esol-csv ${{inputs.esol_csv}}
  --output-dir ${{outputs.artifacts}}
  --hidden 64
  --layers 3
  --epochs 150
  --patience 20
  --lr 1e-3
  --batch-size 64
  --seed 42

environment: azureml:molecule-gnn:1
compute: azureml:gpu-cluster

inputs:
  esol_csv:
    type: uri_file
    path: azureml:moleculenet-esol:1
    mode: download

outputs:
  artifacts:
    type: uri_folder
    mode: rw_mount

identity:
  type: user_identity
