$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: bioemu-chignolin-100
experiment_name: bioemu-quickstart

# Job workdir に inputs/chignolin.fasta を含めるため、リポジトリ内から submit する
# (`code: ../` は quickstart ルートを指す)
code: ../

command: >-
  set -eux;
  python -c "import bioemu, torch, sys; assert torch.cuda.is_available(), 'CUDA GPU is REQUIRED (no CPU fallback for BioEmu)'; print('bioemu', bioemu.__version__, 'PyTorch', torch.__version__, 'CUDA', torch.version.cuda, 'GPU', torch.cuda.get_device_name(0))";
  export XLA_PYTHON_CLIENT_PREALLOCATE=false;
  python -m bioemu.sample
  --sequence ${{inputs.sequence}}
  --num_samples ${{inputs.num_samples}}
  --output_dir ${{outputs.ensemble}}
  --ckpt_path ${{inputs.bioemu_ckpt}}/checkpoint.ckpt
  --base_seed ${{inputs.seed}};
  ls -la ${{outputs.ensemble}}

environment: azureml:bioemu-1-4-1-cuda:1
compute: azureml:gpu-a100

inputs:
  sequence:
    type: uri_file
    path: ../inputs/chignolin.fasta
    mode: download
  # Pinned bioemu-v1.1 checkpoint staged into workspaceblobstore.
  # This avoids passing --model_name (which is used as a HuggingFace repo id
  # and Hydra config key; supplying arbitrary strings is a supply-chain / RCE
  # risk). Stage the checkpoint once with docs/02 §"Stage bioemu checkpoint"
  # and verify sha256 before using. Update the path below to your datastore.
  bioemu_ckpt:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/cache/bioemu/v1.1/
    mode: ro_mount
  num_samples: 100
  seed: 20260807

outputs:
  ensemble:
    type: uri_folder
    mode: rw_mount

resources:
  instance_count: 1

limits:
  # 初回は AlphaFold params 3.5GB + JAX JIT で 30〜60 分かかることがある。
  # chignolin (10 残基) の実サンプリングは数秒、コールドスタート込みで 20 分想定。
  timeout: 7200  # 2 時間

tags:
  scenario: bioemu
  project: spread1000
  target: chignolin
